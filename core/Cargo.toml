[package]
name = "appdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lightweight SurrealDB helper library for Tauri embedded database apps"
documentation = "https://docs.rs/appdb"
readme = "../README.md"

[lib]
name = "appdb"
path = "src/lib.rs"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
appdb-macros.workspace = true
async-trait.workspace = true
inventory.workspace = true
keyring.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
surrealdb.workspace = true
surrealdb-core = { version = "3.1.2", default-features = false, features = ["kv-surrealkv"] }
surrealdb-types.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = "0.7.18"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
trybuild.workspace = true

[target."cfg(windows)".dependencies]
windows.workspace = true
